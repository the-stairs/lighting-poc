appId: com.thestairs.lighting-poc
productName: Lighting POC
buildVersion: "2.0.0"
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - src/main/**
  - package.json
asar: true
publish:
  provider: github
  owner: the-stairs
  repo: lighting-poc
mac:
  category: public.app-category.graphics-design
  target:
    - dmg
    - zip
win:
  target:
    - nsis
    - portable
linux:
  target:
    - AppImage
    - deb
  category: Graphics
